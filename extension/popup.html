<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      text-align: center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #a6adc8;
      letter-spacing: 0.5px;
    }
    .btn-icon {
      cursor: pointer;
      background: none;
      border: none;
      color: #a6adc8;
      font-size: 13px;
      line-height: 1;
      padding: 2px 4px;
    }
    .btn-icon:hover { color: #f38ba8; }
    #code {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #a6e3a1;
      margin: 8px 0;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }
    #code:hover { opacity: 0.85; }
    #timer {
      font-size: 11px;
      color: #a6adc8;
      font-variant-numeric: tabular-nums;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #fff;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #89b4fa; }
    button.primary {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #89b4fa;
      color: #11111b;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button.primary:hover { background: #b4befe; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="view-active" class="hidden">
    <div class="header">
      <span>DIY TOTP</span>
      <button id="btn-reset" class="btn-icon" title="Change Secret Key">⚙</button>
    </div>
    <div id="code" title="Click to copy">------</div>
    <div id="timer">Expires in: 30s</div>
  </div>

  <div id="view-setup" class="hidden">
    <div class="header">
      <span>SETUP KEY</span>
    </div>
    <input id="input-secret" type="password" placeholder="Paste Base32 key" autocomplete="off" />
    <button id="btn-save" class="primary">Save Key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
