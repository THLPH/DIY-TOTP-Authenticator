<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 16px; width: 180px; margin: 0; }
    #code { font-size: 26px; font-weight: bold; letter-spacing: 2px; margin: 10px 0; cursor: pointer; }
    #timer { font-size: 11px; color: #666; }
    #secret-input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 4px; }
    button { padding: 4px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="setup" style="display:none;">
    <input id="secret-input" type="password" placeholder="Base32 Key">
    <button id="save-btn">Save Key</button>
  </div>
  <div id="display" style="display:none;">
    <div id="code">------</div>
    <div id="timer">30s</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
